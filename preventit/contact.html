<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - PreVentIt</title>
    <meta name="description" content="Get in touch with PreVentIt about the soffit vent.">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="brand">
          <img src="logo.png" alt="PreVentIt - Smart Solutions for Your Home" class="brand-logo">
        </a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="product.html">Product</a></li>
          <li><a href="proof.html">Proof</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </div>
    </header>

    <section class="page-banner">
      <h1>Get in touch</h1>
      <p>Questions about PreVentIt, interested in installing it, or want to carry it on a project? Send us a note.</p>
    </section>

    <section class="section">
      <div class="container-narrow">
        <form class="contact-form" action="mailto:Dylanottinger@berkeley.edu" method="get" enctype="text/plain">
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First name</label>
              <input type="text" id="first-name" name="first_name" placeholder="Jane" required>
            </div>
            <div class="form-group">
              <label for="last-name">Last name</label>
              <input type="text" id="last-name" name="last_name" placeholder="Smith" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="jane@company.com" required>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Your message..." required></textarea>
          </div>

          <button type="submit" class="btn btn-navy">Send message &rarr;</button>
        </form>
      </div>
    </section>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-wordmark">PreVentIt</div>
        <div class="footer-tagline">Smart solutions for your home</div>
        <div class="footer-copy">&copy; 2026 PreVentIt, LLC. All rights reserved.</div>
      </div>
    </footer>

    <script src="nav.js"></script>
  </body>
</html>
